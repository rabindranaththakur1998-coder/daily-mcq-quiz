<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Panchayat Quiz With Bishal Chatterjee</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
    <!-- Home Screen -->
    <div id="homeScreen" class="screen home-screen">
        <div class="home-card">
            <div class="logo">
                <i class="fas fa-seedling"></i>
            </div>
            <h1>Daily Panchayat Quiz</h1>
            <p class="subtitle">With Bishal Chatterjee</p>
            <div class="date-box">
                <label for="quizDate"><i class="far fa-calendar-alt"></i> তারিখ</label>
                <input type="date" id="quizDate">
            </div>
            <div class="subject-buttons">
                <button class="sub-btn bangla" onclick="startQuiz('বাংলা')">
                    <i class="fas fa-book-open"></i> বাংলা
                </button>
                <button class="sub-btn english" onclick="startQuiz('ইংরেজি')">
                    <i class="fas fa-globe"></i> ইংরেজি
                </button>
                <button class="sub-btn math" onclick="startQuiz('অংক')">
                    <i class="fas fa-calculator"></i> অংক
                </button>
                <button class="sub-btn gk" onclick="startQuiz('জিকে')">
                    <i class="fas fa-lightbulb"></i> জিকে
                </button>
            </div>
        </div>
    </div>

    <!-- Quiz Screen -->
    <div id="quizScreen" class="screen hidden">
        <div class="quiz-header">
            <button class="icon-btn" onclick="goHome()"><i class="fas fa-arrow-left"></i></button>
            <div class="timer-section">
                <i class="far fa-clock"></i>
                <span id="timerText">00:30</span>
                <div class="timer-bar"><div id="timerFill"></div></div>
            </div>
            <button class="icon-btn" id="paletteBtn"><i class="fas fa-th"></i></button>
        </div>
        <div class="quiz-card">
            <div id="questionCounter" class="counter"></div>
            <h2 id="questionText" class="question"></h2>
            <div id="optionsContainer" class="options-grid"></div>
            <div class="actions">
                <button id="markReviewBtn" class="act-btn"><i class="fas fa-bookmark"></i> রিভিউ</button>
                <button id="clearBtn" class="act-btn"><i class="fas fa-eraser"></i> ক্লিয়ার</button>
                <button id="skipBtn" class="act-btn"><i class="fas fa-forward"></i> স্কিপ</button>
            </div>
            <div class="nav-row">
                <button id="prevBtn" class="nav-btn"><i class="fas fa-chevron-left"></i> আগের</button>
                <button id="submitBtn" class="submit-btn">সাবমিট <i class="fas fa-check"></i></button>
                <button id="nextBtn" class="nav-btn">পরের <i class="fas fa-chevron-right"></i></button>
            </div>
        </div>
    </div>

    <!-- Result Screen -->
    <div id="resultScreen" class="screen hidden">
        <div class="result-card">
            <div class="score-circle">
                <span id="scorePercent">0%</span>
            </div>
            <p class="score-summary">তুমি পেয়েছ <span id="scoreObtained">0</span> / <span id="totalQ"></span></p>
            <div class="stats">
                <div><span id="correctCount">0</span> ঠিক</div>
                <div><span id="wrongCount">0</span> ভুল</div>
                <div><span id="skippedCount">0</span> স্কিপ</div>
                <div>⏱ <span id="timeTaken">0</span>s</div>
            </div>
            <div id="reviewSection" class="review-list"></div>
            <button class="home-btn" onclick="goHome()"><i class="fas fa-home"></i> হোম</button>
        </div>
    </div>

    <!-- Question Palette Modal -->
    <div id="paletteModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>প্রশ্ন প্যালেট</h3>
                <button class="icon-btn" id="closePalette"><i class="fas fa-times"></i></button>
            </div>
            <div id="paletteGrid" class="palette-grid"></div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
