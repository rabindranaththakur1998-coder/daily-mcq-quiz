<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Panchayat Quiz With Bishal Chatterjee</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts: Noto Sans Bengali + Hind Siliguri for variety -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-mode">

<div class="app-wrapper">
    <!-- হোম স্ক্রিন -->
    <div id="homeScreen" class="screen home-screen">
        <div class="home-header">
            <div class="logo-badge">
                <i class="fas fa-landmark"></i>
            </div>
            <h1>Daily Panchayat Quiz</h1>
            <p class="tagline">With Bishal Chatterjee</p>
        </div>
        <div class="date-card">
            <label for="quizDate"><i class="far fa-calendar-alt"></i> তারিখ বাছাই</label>
            <input type="date" id="quizDate">
        </div>
        <div class="subject-grid">
            <button onclick="startQuiz('বাংলা')" class="subject-tile bangla">
                <i class="fas fa-book-open"></i>
                <span>বাংলা</span>
            </button>
            <button onclick="startQuiz('ইংরেজি')" class="subject-tile english">
                <i class="fas fa-globe"></i>
                <span>ইংরেজি</span>
            </button>
            <button onclick="startQuiz('অংক')" class="subject-tile math">
                <i class="fas fa-calculator"></i>
                <span>অংক</span>
            </button>
            <button onclick="startQuiz('জিকে')" class="subject-tile gk">
                <i class="fas fa-lightbulb"></i>
                <span>জিকে</span>
            </button>
        </div>
        <button id="darkModeToggle" class="mode-toggle">
            <i class="fas fa-moon"></i> <span>ডার্ক মোড</span>
        </button>
    </div>

    <!-- কুইজ স্ক্রিন -->
    <div id="quizScreen" class="screen hidden">
        <div class="quiz-header">
            <button id="backToHomeBtn" class="icon-btn"><i class="fas fa-arrow-left"></i></button>
            <div class="timer-circle">
                <svg viewBox="0 0 36 36" class="timer-svg">
                    <path class="timer-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                    <path id="timerPath" class="timer-progress" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                </svg>
                <span id="timerText" class="timer-text">30</span>
            </div>
            <button id="openPaletteBtn" class="icon-btn"><i class="fas fa-th"></i></button>
        </div>
        <div class="quiz-card">
            <div id="questionCounter" class="counter-pill"></div>
            <h2 id="questionText" class="question-text"></h2>
            <div id="optionsContainer" class="options-list"></div>
            <div class="quiz-actions">
                <button id="markReviewBtn" class="chip-btn"><i class="fas fa-bookmark"></i> রিভিউ</button>
                <button id="clearResponseBtn" class="chip-btn"><i class="fas fa-undo-alt"></i> মুছুন</button>
                <button id="skipBtn" class="chip-btn"><i class="fas fa-forward"></i> স্কিপ</button>
            </div>
            <div class="nav-row">
                <button id="prevBtn" class="nav-btn"><i class="fas fa-chevron-left"></i></button>
                <button id="submitBtn" class="submit-btn">সাবমিট <i class="fas fa-check"></i></button>
                <button id="nextBtn" class="nav-btn"><i class="fas fa-chevron-right"></i></button>
            </div>
        </div>
    </div>

    <!-- ফলাফল স্ক্রিন -->
    <div id="resultScreen" class="screen hidden">
        <div class="result-card">
            <div class="score-circle">
                <svg viewBox="0 0 36 36" class="score-svg">
                    <path class="score-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                    <path id="scorePath" class="score-fill" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                </svg>
                <div class="score-inner">
                    <span id="scorePercent">0%</span>
                    <small>স্কোর</small>
                </div>
            </div>
            <div class="stats-row">
                <div class="stat"><span id="correctCount">0</span> ঠিক</div>
                <div class="stat"><span id="wrongCount">0</span> ভুল</div>
                <div class="stat"><span id="skippedCount">0</span> স্কিপ</div>
                <div class="stat">⏱ <span id="timeTaken">0</span>s</div>
            </div>
            <div id="reviewSection" class="review-list"></div>
            <button onclick="goHome()" class="home-btn"><i class="fas fa-home"></i> হোম</button>
        </div>
    </div>

    <!-- বটম শিট প্যালেট -->
    <div id="paletteOverlay" class="palette-overlay hidden"></div>
    <div id="paletteSheet" class="palette-sheet">
        <div class="sheet-handle"></div>
        <h4>প্রশ্ন প্যালেট</h4>
        <div id="paletteGrid" class="palette-grid"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
