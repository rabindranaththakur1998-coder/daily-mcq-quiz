<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Panchayat Quiz With Bishal Chatterjee</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts: Noto Sans Bengali -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Home Screen -->
    <div class="container home-card" id="homeScreen">
        <div class="logo-area">
            <i class="fas fa-graduation-cap"></i>
            <h1>Daily Panchayat Quiz</h1>
            <p class="subtitle">With Bishal Chatterjee</p>
        </div>
        <div class="date-picker">
            <label for="quizDate"><i class="far fa-calendar-alt"></i> তারিখ নির্বাচন</label>
            <input type="date" id="quizDate">
        </div>
        <div class="subject-grid">
            <button onclick="startQuiz('বাংলা')" class="sub-btn bangla">
                <i class="fas fa-book-open"></i> বাংলা
            </button>
            <button onclick="startQuiz('ইংরেজি')" class="sub-btn english">
                <i class="fas fa-globe"></i> ইংরেজি
            </button>
            <button onclick="startQuiz('অংক')" class="sub-btn math">
                <i class="fas fa-calculator"></i> অংক
            </button>
            <button onclick="startQuiz('জিকে')" class="sub-btn gk">
                <i class="fas fa-lightbulb"></i> জিকে
            </button>
        </div>
        <p class="note">প্রতিদিনের প্রশ্ন দেখতে ওপরে তারিখ ঠিক করো</p>
    </div>

    <!-- Quiz Screen -->
    <div class="container quiz-card hidden" id="quizScreen">
        <div class="timer-section">
            <span class="timer-icon"><i class="far fa-clock"></i></span>
            <div id="timerBar"><div id="timerFill"></div></div>
        </div>
        <div id="questionCounter" class="counter"></div>
        <div class="question-box">
            <h2 id="questionText"></h2>
        </div>
        <div id="optionsContainer" class="options-grid"></div>
        <button id="nextBtn" class="next-button hidden" onclick="nextQuestion()">
            পরবর্তী প্রশ্ন <i class="fas fa-arrow-right"></i>
        </button>
    </div>

    <!-- Result Screen -->
    <div class="container result-card hidden" id="resultScreen">
        <div class="score-circle">
            <span id="score" class="score-number">0</span>
            <span class="score-total">/ <span id="totalQ"></span></span>
        </div>
        <h2 class="result-title">তোমার ফলাফল</h2>
        <div id="reviewSection" class="review-list"></div>
        <button onclick="goHome()" class="home-button">
            <i class="fas fa-home"></i> হোমে ফিরে যাও
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
